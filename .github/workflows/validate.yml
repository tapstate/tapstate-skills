name: validate

on:
  push:
    branches:
      - main
      - "ws/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      TAPSTATE_COMMIT: f65260270fb269047f58cba53288dbfa91840ec5
      TAPSTATE_CLI_VERSION: 0.1.0
      TAPSTATE_CLI_LINUX_X64_SHA256: 1ff1cb12e9d4b95e3153dff21bc23843f4829f17f572a59b46ec4518d20dc94b
      TAPSTATE_SCHEMA_SHA256: 7fb7613b8da4b7757d4907e0e0d16ccf7baae3fcc3469492aff1ed98b1d902a7
      # Pinned separately from TAPSTATE_COMMIT above, and that is not an oversight. That pin carries
      # the DSL schema and the CLI; the two files below are a character check. Moving one pin to
      # reach the other's artifact would force this repository to adopt every schema change in
      # between - 648 commits of it, when this was written. Two pins are two things to re-pin; one
      # pin is every unrelated artifact forced to move together.
      TAPSTATE_CHARSET_COMMIT: ee79e25c2491f4e448c4542c9ba5425c64a668d1
      TAPSTATE_NO_CJK_SHA256: 9bd0327deacc7aa45923b2f38226905a68b7f5ba0471f530f98e43542b08acab
      TAPSTATE_CHARSET_ALLOWLIST_SHA256: 7c00f022aae813894efedde9d2f7fcffd28e4dbbdb6921b12ddb083c8534e0d3
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify upstream lock
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          trap 'rm -f "$expected"' EXIT
          cat > "$expected" <<EOF
          tapstate_commit=${TAPSTATE_COMMIT}
          dsl_version=tapstate/v1
          schema_sha256=${TAPSTATE_SCHEMA_SHA256}
          cli_version=${TAPSTATE_CLI_VERSION}
          cli_linux_x64_sha256=${TAPSTATE_CLI_LINUX_X64_SHA256}
          charset_commit=${TAPSTATE_CHARSET_COMMIT}
          no_cjk_sha256=${TAPSTATE_NO_CJK_SHA256}
          charset_allowlist_sha256=${TAPSTATE_CHARSET_ALLOWLIST_SHA256}
          EOF
          diff -u "$expected" upstream.lock

      # THE SAME DECISION, not merely the same list. Two repositories enforcing one rule used to
      # spell it twice: this one enumerated 18 forbidden Unicode ranges, tapstate enumerated 5, and
      # they gave different answers - measured 2026-08-30, this pattern caught Japanese kana and
      # Korean hangul that tapstate let through, while both let through a Cyrillic look-alike, a
      # zero-width space and a right-to-left override. Reconciling only the character list would not
      # have found that: a locale, a regex assembly or a grep flag differing anywhere gives a
      # different answer. So the script is vendored beside the list and both are compared.
      #
      # The list is now what is ALLOWED rather than what is forbidden, which is what makes an
      # unknown character a red instead of a silent pass.
      - name: Check out the pinned Tapstate character check
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tapstate/tapstate
          ref: ${{ env.TAPSTATE_CHARSET_COMMIT }}
          path: .upstream/tapstate-charset
          sparse-checkout: |
            .github/scripts/no-cjk.sh
            .github/charset-allowlist.txt
          sparse-checkout-cone-mode: false

      # Before either file is trusted to decide anything. Editing the vendored copy here reddens on
      # the hash; tapstate editing its own reddens when the pin is next raised, which is a visible
      # delay and the price of a hermetic run.
      - name: Verify the vendored character check against pinned Tapstate
        shell: bash
        run: |
          set -euo pipefail
          upstream=.upstream/tapstate-charset
          echo "${TAPSTATE_NO_CJK_SHA256}  .github/scripts/no-cjk.sh" | sha256sum --check --strict
          echo "${TAPSTATE_NO_CJK_SHA256}  ${upstream}/.github/scripts/no-cjk.sh" | sha256sum --check --strict
          echo "${TAPSTATE_CHARSET_ALLOWLIST_SHA256}  .github/charset-allowlist.txt" | sha256sum --check --strict
          echo "${TAPSTATE_CHARSET_ALLOWLIST_SHA256}  ${upstream}/.github/charset-allowlist.txt" | sha256sum --check --strict
          cmp "${upstream}/.github/scripts/no-cjk.sh" .github/scripts/no-cjk.sh
          cmp "${upstream}/.github/charset-allowlist.txt" .github/charset-allowlist.txt

      # The invariant, as a machine check rather than a habit: this check reads tracked files and
      # commit messages, and nothing else. The steps that read the pull request title and body were
      # removed from here and from tapstate, and nothing stopped one coming back. The mode is part
      # of the vendored script, so both repositories make the statement with the same code; it
      # locates the workflow by looking for whichever one runs the check, which is why it works
      # here without being told this file's name.
      #
      # Scope, in this repository specifically: there is one workflow, so "whichever workflow
      # runs the check" is the whole of CI here. A step that legitimately needs a pull
      # request's title or body - a template check, a title lint - belongs in a workflow file
      # of its own, which this mode does not look at. Added to THIS file it reddens the
      # character check instead, naming a step that has nothing to do with characters.
      - name: This check is still wired to read nothing but files and commit messages
        shell: bash
        run: bash .github/scripts/no-cjk.sh workflows

      - name: Every character in tracked files is on the allow-list
        shell: bash
        run: bash .github/scripts/no-cjk.sh files

      # A commit message is repository content: one written in another language lands in main's
      # history verbatim and no merge launders it, so rewriting it afterwards means a force-push.
      #
      # What this step no longer reads is the pull request's title and body. Those are
      # conversational text, and a check enforcing the project's working language over repository
      # content has no business reading what somebody typed into a comment field - it turns a habit
      # into a door for the people least able to argue with it. The titles and bodies WE send are
      # refused by the scripts that publish them, before the text is ever public.
      - name: Every character in the commit messages is on the allow-list
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: bash .github/scripts/no-cjk.sh messages

      - name: Verify required repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          [[ -f skills/dsl-authoring/SKILL.md ]]
          [[ -f skills/dsl-authoring/agents/openai.yaml ]]
          [[ -f skills/dsl-authoring/references/tapstate-v1.schema.json ]]
          [[ -d skills/dsl-authoring/assets/examples ]]
          find skills/dsl-authoring/assets/examples \
            -type f -name '*.tap.yml' -print -quit | grep -q .

      - name: Verify plugin marketplace metadata
        shell: bash
        run: |
          set -euo pipefail
          ruby -rjson -e '
            claude_path = ".claude-plugin/marketplace.json"
            claude_marketplace = JSON.parse(File.read(claude_path))
            abort("#{claude_path}: expected marketplace name") unless claude_marketplace["name"] == "tapstate-skills"
            claude_plugin = claude_marketplace.fetch("plugins").find { |candidate| candidate["name"] == "tapstate-skills" }
            abort("#{claude_path}: missing tapstate-skills plugin") unless claude_plugin
            abort("#{claude_path}: plugin source must be repository root") unless claude_plugin["source"] == "./"
            version = claude_plugin["version"]
            abort("#{claude_path}: plugin version must omit build metadata") unless version.is_a?(String) && version.match?(/\A\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\z/)

            codex_path = ".agents/plugins/marketplace.json"
            codex_marketplace = JSON.parse(File.read(codex_path))
            abort("#{codex_path}: expected marketplace name") unless codex_marketplace["name"] == "tapstate-skills"
            codex_plugin = codex_marketplace.fetch("plugins").find { |candidate| candidate["name"] == "tapstate-skills" }
            abort("#{codex_path}: missing tapstate-skills plugin") unless codex_plugin
            expected_source = { "source" => "local", "path" => "./" }
            abort("#{codex_path}: plugin source must be repository root") unless codex_plugin["source"] == expected_source
            abort("#{codex_path}: plugin installation policy must be AVAILABLE") unless codex_plugin.dig("policy", "installation") == "AVAILABLE"
            abort("#{codex_path}: plugin authentication policy must be ON_INSTALL") unless codex_plugin.dig("policy", "authentication") == "ON_INSTALL"

            manifest_path = ".codex-plugin/plugin.json"
            manifest = JSON.parse(File.read(manifest_path))
            abort("#{manifest_path}: expected plugin name") unless manifest["name"] == "tapstate-skills"
            abort("#{manifest_path}: version must match marketplace") unless manifest["version"] == version
            abort("#{manifest_path}: skills must resolve from the plugin root") unless manifest["skills"] == "./skills/"
          '

      - name: Verify workspace path boundary
        shell: bash
        run: |
          set -euo pipefail
          skill=skills/dsl-authoring/SKILL.md
          grep -qF '<workspace-root>/source/<id>.tap.yml' "$skill"
          grep -qF 'not a project-binding or' "$skill"
          grep -qF 'installer destination' "$skill"
          grep -qF 'Workspace resolution is a blocking gate' "$skill"
          grep -qF 'never substitute the installed Skill directory' "$skill"
          grep -qF 'Do not run generic repository discovery' "$skill"
          grep -qF 'source_draft -> write -> author' "$skill"
          grep -qF 'Never run `echo`, `printf`, `true`, `:`' "$skill"
          grep -qF 'call `artifact_validate` immediately with the complete YAML' "$skill"
          grep -qF 'source_draft` contract error as an authoritative stop' "$skill"
          grep -qF 'connection_test` and then' "$skill"
          grep -qF '`connection_discover_schema` for every read Source' "$skill"
          grep -qF 'exposed MCP tool inventory' "$skill"
          grep -qF 'returns a transport error is the only basis' "$skill"
          grep -qF 'Never use this fallback while the MCP tool is exposed' "$skill"
          # The edit-and-removal rules. Nothing in this repository executes them: the Skill still
          # installs, the examples still validate and every other check here still passes with the
          # paragraphs below deleted, so this step is the only thing standing between them and a
          # tidying edit. Each prohibition is matched by its own wording rather than by the code it
          # is about - a code name on its own survives having its rule removed from under it.
          grep -qF 'Changing a resource that already exists requires' "$skill"
          grep -qF '`artifact_delete` requires `expectedContentHash`' "$skill"
          grep -qF 'Never answer `artifact.version-conflict` by dropping the precondition' "$skill"
          grep -qF '`artifact.in-use`' "$skill"
          grep -qF 'referrer to clear the way' "$skill"
          grep -qF '`artifact.pipeline-not-stopped`' "$skill"
          grep -qF 'Do not issue a stop' "$skill"
          grep -qF '`artifact.not-found`' "$skill"
          grep -qF 'Never rewrite a precondition-bearing apply into one' "$skill"

      - name: Require marketplace version bump for Skill changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            exit 0
          fi
          if [[ -z "$(git diff --name-only "$base"..HEAD -- skills .agents/plugins .codex-plugin)" ]]; then
            exit 0
          fi
          manifest=.claude-plugin/marketplace.json
          if ! git cat-file -e "$base:$manifest" 2>/dev/null; then
            exit 0
          fi
          previous="$(git show "$base:$manifest" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("plugins").find { |plugin| plugin["name"] == "tapstate-skills" }.fetch("version")')"
          current="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("plugins").find { |plugin| plugin["name"] == "tapstate-skills" }.fetch("version")' "$manifest")"
          ruby -rrubygems -e 'abort("marketplace plugin version must increase when Skills change") unless Gem::Version.new(ARGV.fetch(1)) > Gem::Version.new(ARGV.fetch(0))' "$previous" "$current"

      - name: Verify local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments=full --no-progress './**/*.md'
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0

      - name: Verify Skill shape, discovery, and installation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print | sort)
          [[ "${#manifests[@]}" -gt 0 ]]
          npx --yes skills add . --list | tee /tmp/skills-list.txt
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          git init --quiet "$stage/project"
          for manifest in "${manifests[@]}"; do
            skill="${manifest#skills/}"
            skill="${skill%/SKILL.md}"
            [[ ! -f "skills/$skill/README.md" ]]
            grep -q "$skill" /tmp/skills-list.txt
            (
              cd "$stage/project"
              npx --yes skills add "$GITHUB_WORKSPACE" \
                --skill "$skill" --agent codex --copy --yes
            )
            installed="$stage/project/.agents/skills/$skill"
            [[ -f "$installed/SKILL.md" ]]
            diff -ru "skills/$skill" "$installed"
          done

      - name: Verify scoped global installation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print | sort)
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for manifest in "${manifests[@]}"; do
            skill="${manifest#skills/}"
            skill="${skill%/SKILL.md}"
            npx --yes skills add "$GITHUB_WORKSPACE" \
              --skill "$skill" \
              --agent claude-code codex cursor antigravity-cli \
              --global --yes 2>&1 | tee "$log"
            if grep -qi 'PromptScript' "$log"; then
              echo "::error::Scoped global installation attempted PromptScript."
              exit 1
            fi
            [[ -f "$HOME/.agents/skills/$skill/SKILL.md" ]]
          done

      - name: Reject config and secret material in examples
        shell: bash
        run: |
          set -euo pipefail
          examples=skills/dsl-authoring/assets/examples
          ruby -ryaml -e '
            Dir.glob(ARGV.fetch(0) + "/**/*.tap.yml").sort.each do |path|
              resource = YAML.safe_load(
                File.read(path),
                permitted_classes: [],
                permitted_symbols: [],
                aliases: false
              )
              next unless resource.is_a?(Hash) && resource["kind"] == "source"
              abort("#{path}: Source examples must omit config.") if resource.key?("config")
            end
          ' "$examples"
          if grep -RInEi --include='*.tap.yml' '(password|secret|token|api[_-]?key|private[_-]?key|credential)[[:space:]]*:' "$examples"; then
            echo "::error::Potential secret material found in examples."
            exit 1
          fi

      - name: Verify semantic example invariants
        shell: bash
        run: |
          set -euo pipefail
          mapped=skills/dsl-authoring/assets/examples/filter-and-map/pipeline.tap.yml
          runtime=skills/dsl-authoring/references/runtime-support.md
          grep -qE '^[[:space:]]+display_name:[[:space:]]+"=' "$mapped"
          grep -qE '^[[:space:]]+region:[[:space:]]+"=' "$mapped"
          grep -qF '| Inline nest |' "$runtime"
          grep -qF 'Rejected by the linear DAG builder as a stateful transform.' "$runtime"

      - name: Check out pinned Tapstate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tapstate/tapstate
          ref: ${{ env.TAPSTATE_COMMIT }}
          path: .upstream/tapstate

      - name: Verify vendored schema against pinned Tapstate
        shell: bash
        run: |
          set -euo pipefail
          vendored=skills/dsl-authoring/references/tapstate-v1.schema.json
          generated=.upstream/tapstate/core/core-schema/src/main/resources/schema/tapstate-v1.schema.json
          echo "${TAPSTATE_SCHEMA_SHA256}  ${vendored}" | sha256sum --check --strict
          echo "${TAPSTATE_SCHEMA_SHA256}  ${generated}" | sha256sum --check --strict
          cmp "$generated" "$vendored"

      - name: Validate examples with the pinned Tapstate CLI
        shell: bash
        run: |
          set -euo pipefail
          asset="tapstate-${TAPSTATE_CLI_VERSION}-linux-x64.tar.gz"
          release="https://github.com/tapstate/tapstate/releases/download/v${TAPSTATE_CLI_VERSION}"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          curl --fail --location --retry 3 --output "$stage/$asset" "$release/$asset"
          echo "${TAPSTATE_CLI_LINUX_X64_SHA256}  $stage/$asset" | sha256sum --check --strict
          (
            cd "$stage"
            tar -xzf "$asset"
          )
          cli="$stage/tapstate"
          [[ -x "$cli" ]]
          [[ "$($cli --version)" == "tapstate ${TAPSTATE_CLI_VERSION}" ]]
          while IFS= read -r example; do
            "$cli" validate "$example"
          done < <(find skills/dsl-authoring/assets/examples -mindepth 1 -maxdepth 1 -type d -print | sort)
