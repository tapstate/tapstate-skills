version: tapstate/v1
kind: pipeline
id: customer_documents
source: src_commerce
transforms:
  - id: region_fields
    type: map
    from: [regions]
    fields:
      region_key: $id
      region_name: $name
      id: false
      name: false

  - id: customer_with_orders
    type: nest
    from:
      customer: customers
      order: orders
      region: region_fields
    root:
      from: customer
      key: [customer_id]
      mode: upsert
      embed:
        - from: order
          on:
            customer_id: customer_id
          as: array
          path: orders
          arrayKey: [order_id]
          trackKeyChanges: true
        - from: region
          on:
            region_key: region_id
          as: flat
          key: [region_key]

  - id: public_customer_document
    type: map
    from: customer_with_orders
    fields:
      region_key: false
serve:
  from: public_customer_document
  sync:
    - id: customer_documents
      source: tgt_documents
      write_mode: upsert
